[project]
name = "workspace"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "coverage",
  "pytest",
  "pytest-asyncio",
]

[tool.uv]
package = false
build-constraint-dependencies = ["uv_build>=0.12,<0.13"]
constraint-dependencies = [
  "coverage>=7.16",
  "fastapi>=0.141.1,<1",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3",
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "uvicorn>=0.52.4,<1",
]

[tool.uv.workspace]
members = ["apps/*", "pkgs/*"]

[tool.uv.sources]
api-server = { workspace = true }
auth-service = { workspace = true }
user-service = { workspace = true }
config = { workspace = true }
contract = { workspace = true }
core = { workspace = true }
error = { workspace = true }
model = { workspace = true }

[tool.pyright]
include = ["apps", "pkgs"]
exclude = ["**/.*", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.ruff]
include = [
  "pyproject.toml",
  "{apps,pkgs}/*/pyproject.toml",
  "{apps,pkgs}/*/{src,tests}/**/*.{py,pyi}",
]
extend-exclude = ["**/.*"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
  "FAST",  # fastapi
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
  "B",     # flake8-bugbear
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "PIE",   # flake8-pie
  "PT",    # flake8-pytest-style
  "RET",   # flake8-return
  "SIM",   # flake8-simplify
  "PTH",   # flake8-use-pathlib
  "I",     # isort
  "PERF",  # perflint
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "UP",    # pyupgrade
  "RUF",   # ruff-specific rules
]
ignore = [
  "ANN401", # any-type
  "B008",   # function-call-in-default-argument
  "E501",   # line-too-long
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
  "S101", # assert
]

[tool.pytest.ini_options]
testpaths = [
  "apps/api-server/tests",
  "apps/auth-service/tests",
  "apps/user-service/tests",
  "pkgs/config/tests",
  "pkgs/contract/tests",
  "pkgs/core/tests",
  "pkgs/error/tests",
  "pkgs/model/tests",
]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.coverage.run]
source = [
  "apps/api-server/src",
  "apps/auth-service/src",
  "apps/user-service/src",
  "pkgs/config/src",
  "pkgs/contract/src",
  "pkgs/core/src",
  "pkgs/error/src",
  "pkgs/model/src",
]
branch = true
relative_files = true

[tool.coverage.report]
omit = ["**/.*"]
show_missing = true
skip_empty = true
precision = 2

[tool.coverage.html]
show_contexts = true
skip_empty = true
