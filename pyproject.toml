[project]
name = "workspace"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "coverage>=7.15.4",
  "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
core = { workspace = true }

[tool.ruff]
include = [
  "pyproject.toml",
  "packages/*/pyproject.toml",
  "packages/*/{src,tests}/**/*.{py,pyi}",
]
extend-exclude = ["**/.*"]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = [
  "ERA",   # eradicate
  "FAST",  # fastapi
  "ANN",   # flake8-annotations
  "ASYNC", # flake8-async
  "S",     # flake8-bandit (security)
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "PIE",   # flake8-pie
  "T20",   # flake8-print
  "PYI",   # flake8-pyi
  "PT",    # flake8-pytest-style
  "Q",     # flake8-quotes
  "RSE",   # flake8-raise
  "RET",   # flake8-return
  "SLF",   # flake8-self
  "SIM",   # flake8-simplify
  "SLOT",  # flake8-slots
  "TID",   # flake8-tidy-imports
  "TD",    # flake8-todos
  "TC",    # flake8-type-checking
  "ARG",   # flake8-unused-arguments
  "PTH",   # flake8-use-pathlib
  "FLY",   # flynt
  "I",     # isort
  "NPY",   # numpy-specific rules
  "PD",    # pandas-vet
  "N",     # pep8-naming
  "PERF",  # perflint
  "E",     # pycodestyle errors
  "W",     # pycodestyle warnings
  "F",     # pyflakes
  "PGH",   # pygrep-hooks
  "PL",    # pylint
  "UP",    # pyupgrade
  "FURB",  # refurb
  "RUF",   # ruff-specifc rules
  "TRY",   # tryceratops
]

ignore = [
  "ANN401", # any-type
  "B008",   # function-call-in-default-argument
  "EM101",  # raw-string-in-exception
  "EM102",  # f-string-in-exception
  "TD002",  # missing-todo-author
  "TD003",  # missing-todo-link
  "ARG001", # unused-function-argument
  "ARG002", # unused-method-argument
  "ARG004", # unused-static-method-argument
  "E501",   # line-too-long
  "TRY003", # raise-vanilla-args
]

[tool.pytest.ini_options]
testpaths = [
  "packages/core/tests",
  "packages/api-server/tests",
  "packages/auth-service/tests",
  "packages/user-service/tests",
]
addopts = "-ra -q"

[tool.coverage.run]
source = [
  "packages/core/src",
  "packages/api-server/src",
  "packages/auth-service/src",
  "packages/user-service/src",
]
branch = true

[tool.coverage.report]
omit = ["**/.*"]
show_missing = true

[tool.coverage.html]
show_contexts = true
