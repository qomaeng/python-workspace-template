services:
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    image: api-server:latest
    container_name: api-server
    restart: unless-stopped
    depends_on:
      auth-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      REDIS_HOST: valkey
      POSTGRES_HOST: postgres
    ports:
      - "8000:${API_SERVER_PORT}"
    cpus: 1.20
    mem_limit: 1536m
    mem_reservation: 768m
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile
    image: auth-service:latest
    container_name: auth-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      REDIS_HOST: valkey
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:3000:${AUTH_SERVICE_PORT}"
    cpus: 1.20
    mem_limit: 1536m
    mem_reservation: 768m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$$PORT/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile
    image: user-service:latest
    container_name: user-service
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      REDIS_HOST: valkey
      POSTGRES_HOST: postgres
    ports:
      - "127.0.0.1:3001:${USER_SERVICE_PORT}"
    cpus: 1.20
    mem_limit: 1536m
    mem_reservation: 768m
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:$$PORT/health', timeout=2)\""]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  valkey:
    image: valkey/valkey:9.1.2-alpine
    container_name: quant-valkey
    restart: unless-stopped
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - valkey-data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    cpus: 0.60
    mem_limit: 512m
    mem_reservation: 256m
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:18.6-alpine
    container_name: quant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - postgres-data:/var/lib/postgresql
      # - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "127.0.0.1:5432:5432"
    cpus: 0.80
    mem_limit: 1024m
    mem_reservation: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

volumes:
  valkey-data:
  postgres-data:
