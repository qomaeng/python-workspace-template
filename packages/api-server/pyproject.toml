[project]
name = "api-server"
version = "0.0.1"
description = "API server"
authors = [{ name = "qomaeng", email = "qomaeng@gmail.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "core>=0.0.1",
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/.*", "**/__pycache__"]
pythonVersion = "3.14"
venvPath = "../../"
venv = ".venv"
typeCheckingMode = "standard"

[[tool.pyright.executionEnvironments]]
root = "src"
